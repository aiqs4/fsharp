name: F# CE Desugar Build

on:
  push:
    branches:
      - features/ce-desugar
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages to GitHub Packages
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build F# compiler
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # determinate-nix-action@v3 forces Determinate Nix and a FlakeHub login.
      # That login fails (determinate-nixd / git exit 128) and still writes a
      # bad token into nix.conf, so the next `nix develop` cannot fetch inputs.
      # Upstream Nix with determinate: false keeps GITHUB_TOKEN for GitHub fetches.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
        with:
          determinate: false


      # FSharp.Build.UnitTests/NuGet.Config uses artifacts/ as a local NuGet feed.
      # Ensure the source exists before solution restore runs.
      - name: Prepare local NuGet feed directory
        run: mkdir -p artifacts

      - name: Build compiler and NuGet packages
        shell: bash
        env:
          # distinct prerelease per CI run (11.0.101-ce-desugar.<n>), so GitHub Packages never keeps a stale version
          FSHARP_PACKAGE_SUFFIX: ce-desugar.${{ github.run_number }}
        run: |
          nix develop .#ci --command bash -euo pipefail -c '
            dotnet --info
            ./build/build.sh --publish -f
          '

      # NETSDK1047-style failures mean restore and build disagreed on TFM/RID; show what restore produced.
      - name: Diagnose restore assets (on failure)
        if: failure()
        shell: bash
        run: |
          for p in src/fsc/fscProject src/fsi/fsiProject src/FSharp.Compiler.Interactive.Settings; do
            echo "== $p/obj"; ls -la "$p/obj" 2>&1 | head -12
            f="$p/obj/project.assets.json"
            [ -f "$f" ] && jq -c '{targets: (.targets|keys), frameworks: (.project.frameworks|keys), runtimes: (.project.runtimes // {}|keys), style: .project.restore.projectStyle}' "$f"
            for d in "$p"/obj/*.nuget.dgspec.json; do
              [ -f "$d" ] && jq -c '.projects|to_entries[]|{proj:(.key|split("/")|last), fw:(.value.frameworks|keys), rt:(.value.runtimes // {}|keys), cfg:(.value.restore.configFilePaths // []|length)}' "$d"
            done
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fsharp-ce-desugar-${{ github.sha }}
          path: |
            artifacts/nupkg/*.nupkg
            artifacts/bin/**/*.dll
            artifacts/release/**
          if-no-files-found: error
          retention-days: 14

      # Guards the packaging layout: a nuspec that points at a missing/undefined TFM
      # still packs, but yields an empty lib/ folder.
      - name: Verify NuGet packages
        shell: bash
        run: |
          shopt -s nullglob
          for id in FSharp.Core FSharp.Compiler.Service; do
            pkgs=(artifacts/nupkg/"$id".[0-9]*.nupkg)
            (( ${#pkgs[@]} == 1 )) || { echo "::error::expected exactly one $id package, found ${#pkgs[@]}"; exit 1; }
            echo "== ${pkgs[0]}"; unzip -l "${pkgs[0]}" | grep -E 'lib/[^/]+/[^/]+\.dll' || { echo "::error::${pkgs[0]} contains no lib/<tfm>/*.dll"; exit 1; }
          done

      # Same GITHUB_TOKEN feed that fsharp-wasm's release workflow uses. Only for the
      # real branch (or an explicit dispatch) so experimental branches don't pollute the feed.
      # NB: --skip-duplicate makes re-pushing an identical version a silent no-op.
      - name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/features/ce-desugar' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix develop .#ci --command bash -euo pipefail -c '
            dotnet nuget add source "$FEED" --name github \
              --username "$GH_ACTOR" --password "$GH_TOKEN" --store-password-in-clear-text >/dev/null 2>&1 || true
            dotnet nuget push "artifacts/nupkg/*.nupkg" --source github --api-key "$GH_TOKEN" --skip-duplicate
          '
